<!doctype html>
<html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>KOZMOS — Güneş Sistemi</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070b18;color:#eef3ff;font:16px system-ui}header,main{max-width:1250px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;border-bottom:1px solid #29324d;letter-spacing:.16em;color:#aabaff}h1{font-size:clamp(2.3rem,6vw,5rem);margin:0;letter-spacing:-.06em}p{color:#c0c9df;line-height:1.55}.layout{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:16px}canvas,aside{border:1px solid #29324d;border-radius:18px;background:#0c1224}canvas{width:100%;height:clamp(310px,55vh,580px);display:block;touch-action:none;cursor:grab}aside{padding:22px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}select,button{background:#141c33;color:#eef3ff;border:1px solid #40527b;border-radius:9px;padding:9px 13px;cursor:pointer}button[aria-pressed=true]{background:#bfd0ff;color:#101832}small{color:#aabaff}@media(max-width:720px){.layout{grid-template-columns:1fr}header,main{padding:16px}}
</style>
<header><strong>KOZMOS</strong><select id="language" aria-label="Dil / Language"></select></header>
<main><h1 id="heading">Yörüngeleri keşfet.</h1><p id="instructions">Sahneyi döndürmek için sürükle. Bir gezegen seçerek ayrıntılarını gör.</p>
<div class="layout"><canvas aria-label="Güneş sistemi yörüngelerinin üç boyutlu görünümü"></canvas><aside aria-live="polite"><small id="selected-label">SEÇİLİ GEZEGEN</small><h2 id="name"></h2><p id="info"></p></aside></div>
<nav id="planets" aria-label="Gezegenler"></nav><button id="motion" type="button">Hareketi durdur</button> <button id="reset" type="button">Görünümü sıfırla</button><p><small id="scale-note">Gezegen boyutları, mesafeler ve hareket hızları keşif için stilize edilmiştir.</small></p></main>
<script src="languages.js"></script><script src="scene.js"></script></html>
